name: 功能建议 / Feature request
description: 想让余光多做点什么
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        余光的方向是“安静、不打扰”：会弹窗、会抢焦点、会让人分心的功能一般不会加。说说你在什么场景下需要它，会更容易被采纳。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 在什么场景下，现在哪里不方便
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你设想的做法
      description: 可以附上草图或参考
  - type: textarea
    id: alternatives
    attributes:
      label: 其他办法
      description: 想过的其他方案，或者现在是怎么凑合的
