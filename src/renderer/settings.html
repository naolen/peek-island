<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>余光 · 设置</title>
<link rel="stylesheet" href="settings.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="side-title">我的分组 <span class="hint">滚轮在岛上可切换</span></div>
    <div id="groupList" class="group-list" role="listbox" aria-label="分组"></div>
    <button id="addGroup" class="btn-dashed" type="button">＋ 新建分组</button>
  </aside>

  <main class="main">
    <section class="card">
      <div class="row">
        <label for="groupName" class="label">分组名称</label>
        <input id="groupName" class="input" maxlength="12">
        <div class="spacer"></div>
        <button id="moveUp" class="btn" type="button" aria-label="分组上移">上移</button>
        <button id="moveDown" class="btn" type="button" aria-label="分组下移">下移</button>
        <button id="delGroup" class="btn danger" type="button">删除分组</button>
      </div>
    </section>

    <section class="card grow">
      <div class="row">
        <span class="card-title">股票</span>
        <span class="hint" id="limitHint"></span>
        <div class="spacer"></div>
        <div class="search">
          <label for="search" class="sr-only">添加股票</label>
          <input id="search" class="input wide" placeholder="代码 / 拼音首字母 / 名称，如 600519、gzmt、腾讯、NVDA" autocomplete="off">
          <div id="results" class="results" role="listbox" aria-label="搜索结果"></div>
        </div>
      </div>
      <div class="table-head"><span>名称</span><span>代码</span><span class="r">现价</span><span class="r">涨跌幅</span><span></span></div>
      <div id="stockList" class="stock-list"></div>
    </section>

    <section class="card">
      <div class="card-title">外观 <span class="hint">调低透明度、缩小一点，别人更难注意到</span></div>
      <div class="grid">
        <label class="field">风格
          <select id="style" class="input">
            <option value="classic">经典黑</option>
            <option value="glass">液态玻璃</option>
          </select>
        </label>
        <label class="field">不透明度 <span id="opacityVal" class="num"></span><input id="opacity" type="range" min="0.3" max="1" step="0.05"></label>
        <label class="field">大小 <span id="scaleVal" class="num"></span><input id="scale" type="range" min="0.8" max="1.2" step="0.05"></label>
        <label class="field">离顶边距离 <span id="topVal" class="num"></span><input id="topOffset" type="range" min="0" max="40" step="1"></label>
      </div>
    </section>

    <section class="card">
      <div class="card-title">显示与快捷键</div>
      <div class="grid">
        <label class="field">平时显示为
          <select id="mode" class="input">
            <option value="strip">光带：只有一条细光</option>
            <option value="auto">自动：鼠标靠近时变成岛</option>
            <option value="pinned">常驻：一直显示岛</option>
          </select>
        </label>
        <label class="field">涨跌配色
          <select id="redUp" class="input">
            <option value="1">红涨绿跌</option>
            <option value="0">绿涨红跌</option>
          </select>
        </label>
        <label class="field">行情刷新（秒）<input id="refresh" class="input" type="number" min="1.5" max="60" step="0.5"></label>
        <label class="field">岛上轮播（秒）<input id="rotate" class="input" type="number" min="1.5" max="60" step="0.5"></label>
        <label class="field">离开后缩回（秒）<input id="collapse" class="input" type="number" min="0.2" max="10" step="0.1"></label>
        <label class="field">老板键<input id="bossKey" class="input" placeholder="Control+Alt+S"></label>
      </div>
      <div class="hint" id="saveHint">修改后自动保存</div>
    </section>
  </main>
</div>
<script src="settings.js"></script>
</body>
</html>
