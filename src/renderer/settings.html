<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>余光 · 设置</title>
<link rel="stylesheet" href="settings.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="side-title">我的分组 <span class="hint">滚轮在岛上可切换</span></div>
    <div id="groupList" class="group-list" role="listbox" aria-label="分组"></div>
    <button id="addGroup" class="btn-dashed" type="button">＋ 新建分组</button>
  </aside>

  <main class="main">
    <section class="card">
      <div class="row">
        <label for="groupName" class="label">分组名称</label>
        <input id="groupName" class="input" maxlength="12">
        <div class="spacer"></div>
        <button id="moveUp" class="btn" type="button" aria-label="分组上移">上移</button>
        <button id="moveDown" class="btn" type="button" aria-label="分组下移">下移</button>
        <button id="delGroup" class="btn danger" type="button">删除分组</button>
      </div>
    </section>

    <section class="card grow">
      <div class="row">
        <span class="card-title">股票</span>
        <span class="hint" id="limitHint"></span>
        <div class="spacer"></div>
        <div class="search">
          <label for="search" class="sr-only">添加股票</label>
          <input id="search" class="input wide" placeholder="代码 / 拼音首字母 / 名称，如 600519、gzmt、腾讯、NVDA" autocomplete="off">
          <div id="results" class="results" role="listbox" aria-label="搜索结果"></div>
        </div>
      </div>
      <div class="table-head"><span>名称</span><span>代码</span><span class="r">现价</span><span class="r">涨跌幅</span><span></span></div>
      <div id="stockList" class="stock-list"></div>
    </section>

    <section class="card">
      <div class="card-title">外观 <span class="hint">调低透明度、缩小一点，别人更难注意到</span></div>
      <div class="grid">
        <label class="field">风格
          <select id="style" class="input">
            <option value="classic">经典黑</option>
            <option value="glass">液态玻璃</option>
          </select>
        </label>
        <label class="field">不透明度 <span id="opacityVal" class="num"></span><input id="opacity" type="range" min="0.3" max="1" step="0.05"></label>
        <label class="field">大小 <span id="scaleVal" class="num"></span><input id="scale" type="range" min="0.8" max="1.2" step="0.05"></label>
        <label class="field">离顶边距离 <span id="topVal" class="num"></span><input id="topOffset" type="range" min="0" max="40" step="1"></label>
      </div>
    </section>

    <section class="card">
      <div class="card-title">系统通知 <span id="notifyStatus" class="hint"></span></div>
      <div class="grid">
        <label class="field">读取系统通知
          <select id="notify" class="input"><option value="1">开启</option><option value="0">关闭</option></select>
        </label>
        <label class="field">来通知时
          <select id="notifyPopup" class="input"><option value="1">岛上弹出卡片</option><option value="0">只亮提示，不弹出</option></select>
        </label>
        <label class="field">提醒哪些应用
          <select id="notifyAll" class="input"><option value="0">常用办公应用 + 下面勾选的</option><option value="1">所有应用（下面可取消）</option></select>
        </label>
      </div>
      <div class="hint">默认提醒：飞书、QQ、钉钉、企业微信、Outlook、Teams 和邮件类应用。下面列出最近发过通知的应用：</div>
      <div id="notifyApps" class="app-list"></div>
    </section>

    <section class="card">
      <div class="card-title">邮箱 <span class="hint">新邮件会在岛上提醒；只读取，不会把邮件标成已读，也不下载附件和图片</span></div>
      <div id="mailList" class="mail-list"></div>
      <div id="mailForm" class="mail-form">
        <div class="grid">
          <label class="field">邮箱类型
            <select id="mailPreset" class="input"></select>
          </label>
          <label class="field">邮箱地址<input id="mailEmail" class="input" type="email" placeholder="name@qq.com" autocomplete="off"></label>
          <label class="field">授权码 / 应用专用密码<input id="mailPass" class="input" type="password" autocomplete="new-password" placeholder="不是登录密码"></label>
          <label class="field custom-only">IMAP 服务器<input id="mailHost" class="input" placeholder="imap.example.com"></label>
          <label class="field custom-only">端口<input id="mailPort" class="input" type="number" value="993"></label>
          <label class="field">显示名称（可选）<input id="mailLabel" class="input" maxlength="20" placeholder="例如：工作邮箱"></label>
        </div>
        <div id="mailHelp" class="hint"></div>
        <div class="row">
          <button id="mailSave" class="btn primary" type="button">测试并保存</button>
          <button id="mailCancel" class="btn" type="button">取消</button>
          <span id="mailMsg" class="hint"></span>
        </div>
      </div>
      <button id="mailAdd" class="btn-dashed" type="button">＋ 添加邮箱</button>
    </section>

    <section class="card">
      <div class="card-title">剪贴板与待办</div>
      <div class="grid">
        <label class="field">记录剪贴板
          <select id="clipEnabled" class="input"><option value="1">开启</option><option value="0">关闭</option></select>
        </label>
        <label class="field">记录图片
          <select id="clipImages" class="input"><option value="1">记录</option><option value="0">只记文字</option></select>
        </label>
        <label class="field">最多保留（条，收藏不计）<input id="clipLimit" class="input" type="number" min="20" max="2000" step="10"></label>
        <label class="field">唤出剪贴板 <span id="clipKeyStatus" class="key-status"></span><input id="clipKey" class="input" placeholder="Control+Alt+V"></label>
        <label class="field">唤出待办 <span id="todoKeyStatus" class="key-status"></span><input id="todoKey" class="input" placeholder="Control+Alt+T"></label>
        <label class="field">没做完的事
          <select id="todoRollover" class="input"><option value="1">第二天自动顺延</option><option value="0">留在当天</option></select>
        </label>
      </div>
    </section>

    <section class="card">
      <div class="card-title">显示与快捷键</div>
      <div class="grid">
        <label class="field">平时显示为
          <select id="mode" class="input">
            <option value="strip">光带：只有一条细光</option>
            <option value="auto">自动：鼠标靠近时变成岛</option>
            <option value="pinned">常驻：一直显示岛</option>
          </select>
        </label>
        <label class="field">涨跌配色
          <select id="redUp" class="input">
            <option value="1">红涨绿跌</option>
            <option value="0">绿涨红跌</option>
          </select>
        </label>
        <label class="field">行情刷新（秒）<input id="refresh" class="input" type="number" min="1.5" max="60" step="0.5"></label>
        <label class="field">岛上轮播（秒）<input id="rotate" class="input" type="number" min="1.5" max="60" step="0.5"></label>
        <label class="field">离开后缩回（秒）<input id="collapse" class="input" type="number" min="0.2" max="10" step="0.1"></label>
        <label class="field">老板键 <span id="bossKeyStatus" class="key-status"></span><input id="bossKey" class="input" placeholder="Control+Alt+S"></label>
        <label class="field">正在播放的音乐
          <select id="music" class="input">
            <option value="1">在岛上显示</option>
            <option value="0">不显示</option>
          </select>
        </label>
      </div>
      <div class="hint" id="saveHint">修改后自动保存</div>
    </section>
  </main>
</div>
<script src="settings.js"></script>
</body>
</html>
