<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>余光</title>
<link rel="stylesheet" href="island.css">
</head>
<body>
<!-- 一个会变形的元素：光带 ⇄ 岛 ⇄ 展开 -->
<div id="hot" class="interactive">
  <div class="ear ear-l" aria-hidden="true"></div>
  <div class="ear ear-r" aria-hidden="true"></div>

  <div id="morph" data-form="strip">

    <!-- 形态一：光带 -->
    <div id="strip" class="layer">
      <div id="segs"></div>
      <button id="musicSeg" class="seg-item music-seg" type="button" aria-label="正在播放"><span class="light"></span></button>
      <button id="msgSeg" class="seg-item" type="button" aria-label="新消息"><span class="light"></span></button>
    </div>

    <!-- 形态二：岛 -->
    <div id="island" class="layer">
      <button id="tickerZone" class="zone" type="button" aria-label="展开行情">
        <span id="tickDot" class="dot"></span>
        <span class="ticker-window"><span id="ticker"></span></span>
        <span id="islandGroup" class="group-tag"></span>
      </button>
      <button id="musicZone" class="zone" type="button" aria-label="正在播放，点击展开">
        <span id="mzThumb" class="mz-thumb"></span>
        <span id="mzEq" class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </button>
      <button id="msgZone" class="zone" type="button" aria-label="新消息，点击查看">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9DB8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span id="msgCount" class="num badge"></span>
      </button>
    </div>

    <!-- 来通知时：岛变成一张卡片 -->
    <div id="alert" class="layer" role="status" aria-live="polite">
      <button id="alertBtn" type="button" class="alert-btn" aria-label="查看消息">
        <span id="alertAvatar" class="avatar"></span>
        <span class="alert-meta">
          <span class="alert-top"><span id="alertApp"></span><span id="alertTime" class="num"></span></span>
          <span id="alertTitle" class="alert-title"></span>
          <span id="alertBody" class="alert-body"></span>
        </span>
      </button>
    </div>

    <!-- 形态三：展开面板 -->
    <div id="panel" class="layer" role="dialog" aria-label="行情" data-page="stock">
      <div class="panel-head">
        <div id="pageTabs" class="pages" role="tablist" aria-label="页面">
          <span class="pages-thumb" aria-hidden="true"></span>
          <button type="button" role="tab" data-page="stock" aria-label="行情"><i class="pdot" style="background:#FF8A7A"></i><span class="pname">行情</span></button>
          <button type="button" role="tab" data-page="music" aria-label="音乐"><i class="pdot" style="background:#A98BFF"></i><span class="pname">音乐</span></button>
          <button type="button" role="tab" data-page="clip" aria-label="剪贴板"><i class="pdot" style="background:#6BD3C8"></i><span class="pname">剪贴板</span></button>
          <button type="button" role="tab" data-page="todo" aria-label="待办"><i class="pdot" style="background:#FFC26B"></i><span class="pname">待办</span></button>
          <button type="button" role="tab" data-page="msg" aria-label="消息"><i class="pdot" style="background:#5B8CFF"></i><span class="pname">消息</span><span id="tabMsgCount" class="num badge tab-badge"></span></button>
        </div>
        <span id="pageTitle" class="page-title">行情</span>
        <div class="spacer"></div>
        <div id="modeSeg" class="seg" role="radiogroup" aria-label="平时显示为">
          <span class="seg-thumb" aria-hidden="true"></span>
          <button type="button" role="radio" data-mode="strip" title="平时只有一条细光，最隐蔽">光带</button>
          <button type="button" role="radio" data-mode="auto" title="平时是光带，鼠标靠近时变成岛">自动</button>
          <button type="button" role="radio" data-mode="pinned" title="一直显示为岛">常驻</button>
        </div>
        <button id="btnSettings" class="icon-btn" type="button" aria-label="设置">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        </button>
        <button id="btnClose" class="icon-btn" type="button" aria-label="收起">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 15l-6-6-6 6"/></svg>
        </button>
      </div>

      <div id="panelBody" class="fade page-stock">
        <!-- 指数条：点一下在下面的图里看这个指数 -->
        <div id="idxRow" class="idx-row" role="list" aria-label="指数"></div>
        <div class="group-row">
          <div id="groupTabs" class="tabs" role="tablist" aria-label="分组"></div>
          <span id="sessionChip" class="session-chip" role="status"></span>
        </div>
        <div class="info">
          <div class="info-name">
            <span id="curName"></span>
            <span id="curSub" class="num sub"></span>
          </div>
          <button id="btnAlert" class="alert-pill" type="button" aria-label="预警">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            <span id="alertCnt">预警</span>
          </button>
          <span id="curPrice" class="num big"></span>
          <span id="curPct" class="num pill"></span>
        </div>
        <div id="holdLine" class="hold-line num"></div>

        <div class="chart-bar">
          <div id="chartTabs" class="mini-seg" role="tablist" aria-label="图表">
            <button type="button" role="tab" data-view="min1" aria-selected="true">分时</button>
            <button type="button" role="tab" data-view="min5" aria-selected="false">五日</button>
            <button type="button" role="tab" data-view="day" aria-selected="false">日K</button>
            <button type="button" role="tab" data-view="week" aria-selected="false">周K</button>
          </div>
          <span class="spacer"></span>
          <span id="legend" class="num legend"></span>
        </div>
        <div id="chart" class="chart">
          <svg id="chartSvg" width="564" height="170" viewBox="0 0 564 170" preserveAspectRatio="none" aria-hidden="true"></svg>
          <span id="axHi" class="num ax ax-tl"></span>
          <span id="axMid" class="num ax ax-ml"></span>
          <span id="axLo" class="num ax ax-bl"></span>
          <span id="axHiP" class="num ax ax-tr"></span>
          <span id="axLoP" class="num ax ax-br"></span>
          <span id="crossLine" class="cross-line" aria-hidden="true"></span>
          <span id="crossDot" class="cross-dot" aria-hidden="true"></span>
          <div id="chartEmpty" class="chart-empty">加载中…</div>
          <div id="chartHit" class="chart-hit"></div>
        </div>
        <svg id="volSvg" width="564" height="30" viewBox="0 0 564 30" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div id="timeAxis" class="num time-axis"></div>

        <!-- 数据 / 五档 / 持仓 -->
        <div class="data-box">
          <div id="dataTabs" class="data-tabs" role="tablist" aria-label="详情">
            <button type="button" role="tab" data-d="data" aria-selected="true">数据</button>
            <button type="button" role="tab" data-d="book" aria-selected="false">五档</button>
            <button type="button" role="tab" data-d="hold" aria-selected="false">本组持仓</button>
          </div>
          <div id="dataView" class="data-view"></div>
        </div>

        <div id="chips" class="chips"></div>
      </div>

      <!-- 预警设置（盖在行情页上） -->
      <div id="alertSheet" class="sheet" role="dialog" aria-label="设置预警">
        <div class="sheet-head">
          <span id="asTitle" class="sheet-title"></span>
          <span id="asNow" class="num sub"></span>
          <span class="spacer"></span>
          <button id="asClose" class="icon-btn" type="button" aria-label="关闭">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div id="asRules" class="rules"></div>
        <div class="rule-opts">
          <span class="opt-label">提醒方式</span>
          <div id="asNotify" class="mini-seg" role="radiogroup" aria-label="提醒方式">
            <button type="button" role="radio" data-v="card">弹出卡片</button>
            <button type="button" role="radio" data-v="strip">只闪光带</button>
          </div>
          <span class="opt-label">触发后</span>
          <div id="asRepeat" class="mini-seg" role="radiogroup" aria-label="触发后">
            <button type="button" role="radio" data-v="once">提醒一次</button>
            <button type="button" role="radio" data-v="daily">每天一次</button>
            <button type="button" role="radio" data-v="every">每次</button>
          </div>
        </div>
        <div class="sheet-foot">
          <button id="asDelete" class="link-btn danger" type="button">删除这只的预警</button>
          <span class="spacer"></span>
          <button id="asCancel" class="btn" type="button">取消</button>
          <button id="asSave" class="btn primary" type="button">保存</button>
        </div>
      </div>

      <!-- 持仓编辑 -->
      <div id="holdSheet" class="sheet" role="dialog" aria-label="编辑持仓">
        <div class="sheet-head">
          <span id="hsTitle" class="sheet-title"></span>
          <span class="spacer"></span>
          <button id="hsClose" class="icon-btn" type="button" aria-label="关闭">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="hold-form">
          <label class="field"><span>持股数量</span><input id="hsQty" class="field-input num" inputmode="decimal" placeholder="例如 200"></label>
          <label class="field"><span>成本价（<span id="hsCur">元</span>）</span><input id="hsCost" class="field-input num" inputmode="decimal" placeholder="可以不填"></label>
        </div>
        <div id="hsPreview" class="hold-preview num"></div>
        <div class="sheet-foot">
          <button id="hsDelete" class="link-btn danger" type="button">清除持仓</button>
          <span class="spacer"></span>
          <button id="hsCancel" class="btn" type="button">取消</button>
          <button id="hsSave" class="btn primary" type="button">保存</button>
        </div>
      </div>

      <!-- 右键菜单 -->
      <div id="ctxMenu" class="ctx-menu" role="menu"></div>

      <!-- 音乐页 -->
      <div id="musicPage" class="music-page">
        <div id="musicEmpty" class="music-empty">现在没有在播放的音乐<br><span>QQ 音乐、网易云、Spotify、浏览器等接入了系统媒体控制的播放器都能显示</span></div>
        <div id="musicBody">
          <div class="m-head">
            <span id="mCover" class="m-cover"></span>
            <div class="m-meta">
              <span id="mTitle" class="m-title"></span>
              <span id="mArtist" class="m-artist"></span>
              <span id="mApp" class="m-app"></span>
            </div>
          </div>
          <div id="mViz" class="m-viz" aria-hidden="true"></div>
          <div class="m-progress">
            <div class="m-track"><span id="mBar" class="m-bar"></span></div>
            <div class="num m-times"><span id="mPos">0:00</span><span id="mDur">0:00</span></div>
          </div>
          <div class="m-ctrls">
            <button id="mPrev" class="icon-btn big-btn" type="button" aria-label="上一首">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
            </button>
            <button id="mToggle" class="play-btn" type="button" aria-label="播放 / 暂停"></button>
            <button id="mNext" class="icon-btn big-btn" type="button" aria-label="下一首">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
            </button>
          </div>
        </div>
      </div>
      <!-- 剪贴板页 -->
      <div id="clipPage" class="clip-page">
        <div class="clip-bar">
          <label for="clipSearch" class="sr-only">搜索剪贴板</label>
          <input id="clipSearch" class="field-input" placeholder="搜索内容或备注…" autocomplete="off">
          <div id="clipKinds" class="mini-seg" role="radiogroup" aria-label="筛选">
            <button type="button" role="radio" data-kind="all" aria-checked="true">全部</button>
            <button type="button" role="radio" data-kind="fav" aria-checked="false">收藏</button>
            <button type="button" role="radio" data-kind="text" aria-checked="false">文字</button>
            <button type="button" role="radio" data-kind="image" aria-checked="false">图片</button>
          </div>
        </div>
        <div id="clipList" class="clip-list" role="list"></div>
        <div class="list-foot">
          <span id="clipCount"></span>
          <button id="clipClear" class="link-btn" type="button">清空（保留收藏）</button>
        </div>
      </div>

      <!-- 待办页 -->
      <div id="todoPage" class="todo-page">
        <div class="todo-head">
          <span id="todoDate" class="todo-date"></span>
          <span id="todoStat" class="num todo-stat"></span>
          <span class="spacer"></span>
          <button id="todoToday" class="link-btn" type="button">回到今天</button>
          <button id="todoHistory" class="link-btn" type="button">历史</button>
          <button id="todoExport" class="link-btn" type="button">导出 Markdown</button>
        </div>
        <div id="todoDayView">
          <div id="todoAddRow" class="todo-add">
            <label for="todoInput" class="sr-only">添加待办</label>
            <input id="todoInput" class="field-input" placeholder="添加待办，回车确认" maxlength="300" autocomplete="off">
          </div>
          <div id="todoList" class="todo-list" role="list"></div>
          <label for="todoNote" class="todo-note-label">今日笔记</label>
          <textarea id="todoNote" class="todo-note" placeholder="随手记点什么，自动保存" maxlength="20000"></textarea>
          <div id="todoNoteView" class="todo-note-view"></div>
        </div>
        <div id="todoArchive" class="todo-archive" role="list"></div>
      </div>

      <!-- 消息页：系统通知 + 邮件 -->
      <div id="msgPage" class="msg-page">
        <div id="notifyBanner" class="banner"></div>
        <div class="clip-bar">
          <div id="msgKinds" class="mini-seg" role="radiogroup" aria-label="筛选">
            <button type="button" role="radio" data-kind="all" aria-checked="true">全部</button>
            <button type="button" role="radio" data-kind="notify" aria-checked="false">通知</button>
            <button type="button" role="radio" data-kind="mail" aria-checked="false">邮件</button>
            <button type="button" role="radio" data-kind="alert" aria-checked="false">预警</button>
          </div>
          <span class="spacer"></span>
          <button id="msgReadAll" class="link-btn" type="button">全部已读</button>
          <button id="msgClear" class="link-btn" type="button">清空</button>
        </div>
        <div id="msgList" class="clip-list" role="list"></div>
      </div>

      <div id="foot" class="foot"></div>
    </div>
  </div>

  <!-- 悬停气泡（光带上的某一段 / 岛上的行情） -->
  <div id="bubble" class="bubble glass" aria-hidden="true">
    <div class="bubble-row">
      <span id="bName"></span>
      <span id="bPrice" class="num muted"></span>
      <span id="bPct" class="num strong"></span>
    </div>
    <svg id="bMini" width="170" height="34" viewBox="0 0 170 34" aria-hidden="true"></svg>
  </div>
  <!-- 悬停气泡（音乐） -->
  <div id="mBubble" class="bubble glass m-bubble" aria-hidden="true">
    <span id="mbThumb" class="mb-thumb"></span>
    <span class="mb-meta"><span id="mbTitle" class="mb-title"></span><span id="mbArtist" class="mb-artist"></span></span>
  </div>
</div>
<script src="island.js"></script>
</body>
</html>
